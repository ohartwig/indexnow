des whether a host may be announced to search engines at all.\n *\n * IndexNow submissions are shared between all participating engines and\n * cannot be taken back. A staging host that gets submitted once is known to\n * every one of them, so the check sits in the library, in front of any network\n * I\/O, rather than in each integration where it can be forgotten.\n *\n * Refused by default:\n *  - IP literals and single-label names \u2014 nothing a search engine should index;\n *  - reserved and private-use suffixes (RFC 2606, RFC 6761, RFC 6762, RFC 8375,\n *    RFC 9476, ICANN's \".internal\") such as .localhost, .test, .invalid;\n *  - pre-production labels such as \"dev\" or \"staging\" anywhere left of the\n *    registrable part, e.g. shop.dev.example.com or staging.example.co.uk.\n *\n * The label rule looks only at labels left of the last two, so real names like\n * dev.to or the \".dev\" top-level domain are not caught by it.\n *\/\nfinal readonly class HostPolicy\n{\n    public const RESERVED_SUFFIXES = [\n        'localhost',\n        'test',\n        'invalid',\n        'example',\n        'local',\n        'localdomain',\n        'internal',\n        'intranet',\n        'lan',\n        'home',\n        'corp',\n        'private',\n        'home.arpa',\n        'onion',\n        'alt',\n        'example.com',\n        'example.net',\n        'example.org',\n    ];\n\n    public const PRE_PRODUCTION_LABELS = [\n        'dev',\n        'develop',\n        'development',\n        'staging',\n        'stage',\n        'stg',\n        'test',\n        'testing',\n        'qa',\n        'uat',\n        'preview',\n        'sandbox',\n    ];\n\n    \/**\n     * @param list<string> $deniedSuffixes additional suffixes to refuse, matched on label boundaries\n     * @param list<string> $preProductionLabels labels that mark a host as not production\n     *\/\n    public function __construct(\n        private array $deniedSuffixes = [],\n        private array $preProductionLabels = self::PRE_PRODUCTION_LABELS,\n    ) {}\n\n    public static function default(): self\n    {\n        return new self();\n    }\n\n    public function withDeniedSuffixes(string ...$suffixes): self\n    {\n        $normalized = array_map(static fn(string $suffix): string => HostName::normalize(ltrim($suffix, '.*')), $suffixes);\n\n        return new self(\n            array_values(array_unique([...$this->deniedSuffixes, ...array_filter($normalized, static fn(string $s): bool => $s !== '')])),\n            $this->preProductionLabels,\n        );\n    }\n\n    \/** @param list<string> $labels *\/\n    public function withPreProductionLabels(array $labels): self\n    {\n        return new self($this->deniedSuffixes, array_map('strtolower', $labels));\n    }\n\n    public function allows(string $host): bool\n    {\n        return $this->refusalReason($host) === null;\n    }\n\n    \/** @throws HostNotAllowed *\/\n    public function assertAllows(string $host): void\n    {\n        $reason = $this->refusalReason($host);\n        if ($reason !== null) {\n            throw new HostNotAllowed($host, $reason);\n        }\n    }\n\n    \/** Null when the host may be submitted, otherwise why not \u2014 meant for status output and logs. *\/\n    public function refusalReason(string $host): ?string\n    {\n        $host = HostName::normalize($host);\n\n        if ($host === '') {\n            return 'the host is empty';\n        }\n        if (str_starts_with($host, '[') || filter_var($host, FILTER_VALIDATE_IP) !== false) {\n            return 'IP addresses are never submitted';\n        }\n        if (!str_contains($host, '.')) {\n            return 'single-label hosts are not public';\n        }\n        if (strlen($host) > 253 || preg_match('\/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$\/D', $host) !== 1) {\n            return 'not a valid DNS host name';\n        }\n\n        foreach ([...self::RESERVED_SUFFIXES, ...$this->deniedSuffixes] as $suffix) {\n            if ($host === $suffix || str_ends_with($host, '.' . $suffix)) {\n                return sprintf('\".%s\" is a reserved or denied suffix', $suffix);\n            }\n        }\n\n        $labels = explode('.', $host);\n        foreach (array_slice($labels, 0, -2) as $label) {\n            if (in_array($label, $this->preProductionLabels, true)) {\n                return sprintf('the label \"%s\" marks a pre-production host', $label);\n            }\n        }\n\n        return null;\n    }\n}\n","mutants":[{"id":"044ab5d00399d3a4fadc5d17216edaaa","mutatorName":"PublicVisibility","replacement":"protected static function default(): self","description":"Replaces the `public` method visibility keyword with `protected`.","location":{"start":{"line":77,"column":5},"end":{"line":77,"column":43}},"status":"Killed","statusReason":"PHPUnit 12.5.36 by Sebastian Bergmann and contributors.\n\nRuntime:       PHP 8.5.8\nConfiguration: \/private\/var\/folders\/cz\/m_7cdc311m77krsclk6kr88r0000gn\/T\/infection\/phpunitConfiguration.044ab5d00399d3a4fadc5d17216edaaa.infection.xml\n\n.....................E\n\nTime: 00:00.028, Memory: 18.00 MB\n\nThere was 1 error:\n\n1) Koh\\IndexNow\\Tests\\EdgeCasesTest::theClientExposesItsEndpointPolicyAndUserAgent\nError: Call to protected method Koh\\IndexNow\\HostPolicy::default() from scope Koh\\IndexNow\\Tests\\EdgeCasesTest\n\n\/Volumes\/Samsung_X5\/Projects\/koh-indexnow\/tests\/EdgeCasesTest.php:211\n\nERRORS!\nTests: 22, Assertions: 55, Errors: 1.","coveredBy":["e8a2ed88c558525d0d2f29f32cd0b97b","3ab25a3a04ebab281b06c2cbe10a5138","61edfff2a590ea86daa012157d5f6e36","55308e3986a361702a6ed159177f4303","02ee1e72069a6ec7201cf46c2d83cb69","43cd0419144582b93594978bfae2e85c","c9d47542687ad8278301b8abaedea723","fa1de0be72338b896b301f8acbf519bd","048cfa9d1433040a431d4101059597da","007474bb78eb96d8be115ed33b14943a","1cc12d442c6fb91c34dafe17f59d2bde","634f5c36bfbea3b46c7e316b579e0dea","10e1b1218b849d1f3435a95d t.\n *\n * The host policy runs before anything touches the network, and it runs here,\n * not in the integrations: a submission cannot be recalled, so the one check\n * that must never be skipped lives where every path goes through.\n *\n * Timeouts belong to the PSR-18 client you pass in. Give it a short one \u2014 five\n * to ten seconds \u2014 and let the caller's queue retry; an engine that is slow\n * today must not stall the process that publishes content. Do not let it\n * follow redirects either: the body carries the key.\n *\/\nfinal readonly class IndexNowClient\n{\n    public const USER_AGENT = 'koh-indexnow\/1 (+https:\/\/github.com\/ole-hartwig\/indexnow)';\n\n    private Endpoint $endpoint;\n\n    private HostPolicy $hostPolicy;\n\n    public function __construct(\n        private ClientInterface $http,\n        private RequestFactoryInterface $requests,\n        private StreamFactoryInterface $streams,\n        ?Endpoint $endpoint = null,\n        ?HostPolicy $hostPolicy = null,\n        private string $userAgent = self::USER_AGENT,\n    ) {\n        $this->endpoint = $endpoint ?? Endpoint::default();\n        $this->hostPolicy = $hostPolicy ?? HostPolicy::default();\n    }\n\n    \/**\n     * Send one protocol-sized submission.\n     *\n     * @throws HostNotAllowed    when the host must not be announced \u2014 nothing has been sent\n     * @throws \\LengthException  when the submission is empty or larger than the protocol allows\n     *\/\n    public function submit(Submission $submission): Result\n    {\n        $this->hostPolicy->assertAllows($submission->host);\n\n        if ($submission->isEmpty() || $submission->count() > Submission::MAX_URLS) {\n            throw new \\LengthException(sprintf(\n                'A submission must carry 1 to %d URLs; use submitAll() for larger lists. Got %d.',\n                Submission::MAX_URLS,\n                $submission->count(),\n            ), 1790000006);\n        }\n\n        $request = $this->requests->createRequest('POST', $this->endpoint->url)\n            ->withHeader('Content-Type', 'application\/json; charset=utf-8')\n            ->withHeader('User-Agent', $this->userAgent)\n            ->withBody($this->streams->createStream(json_encode(\n                $submission->toPayload(),\n                \\JSON_THROW_ON_ERROR | \\JSON_UNESCAPED_SLASHES | \\JSON_UNESCAPED_UNICODE,\n            )));\n\n        try {\n            $response = $this->http->sendRequest($request);\n        } catch (ClientExceptionInterface $e) {\n            return Result::transportError($e, $submission);\n        }\n\n        return Result::fromResponse($response, $submission);\n    }\n\n    \/**\n     * Send a submission of any size in protocol-sized parts.\n     *\n     * Stops at the first part that does not succeed: an engine that throttles\n     * or fails on part one will do the same on part two, and the remaining\n     * URLs are better kept for the caller's next attempt. The returned list\n     * holds one result per part actually sent; an empty submission sends\n     * nothing and returns an empty list.\n     *\n     * @return list<Result>\n     *\n     * @throws HostNotAllowed\n     *\/\n    public function submitAll(Submission $submission): array\n    {\n        $this->hostPolicy->assertAllows($submission->host);\n\n        $results = [];\n        foreach ($submission->chunks() as $chunk) {\n            $results[] = $result = $this->submit($chunk);\n            if (!$result->isSuccess()) {\n                break;\n            }\n        }\n\n        return $results;\n    }\n\n    public function endpoint(): Endpoint\n    {\n        return $this->endpoint;\n    }\n\n    public function hostPolicy(): HostPolicy\n    {\n        return $this->hostPolicy;\n    }\n}\n","mutants":[{"id":"15483ee81a10a40bcfee30b185fda497","mutatorName":"Coalesce","replacement":"$this->endpoint = Endpoint::default() ?? $endpoint;","description":"Swaps the coalesce operator (`??`) operands,\ne.g. rep _types=1);\n\nnamespace Koh\\IndexNow;\n\nuse Koh\\IndexNow\\Exception\\InvalidKey;\n\n\/**\n * An IndexNow key: proof that whoever submits URLs for a host controls it.\n *\n * The protocol allows 8 to 128 characters of a-z, A-Z, 0-9 and \"-\". The key is\n * not a secret in the cryptographic sense \u2014 it is published in the key file \u2014\n * but until the first submission nobody else knows it, and a key that can be\n * guessed lets a stranger spend the host's crawl budget. Hence derive(): a key\n * computed from an installation secret needs no storage, no provisioning step\n * and no one to remember it, and it differs per host by construction.\n *\/\nfinal readonly class Key implements \\Stringable\n{\n    private const PATTERN = '\/^[A-Za-z0-9-]{8,128}$\/D';\n\n    \/** Versioned so a future change of the derivation cannot collide with today's keys. *\/\n    private const DERIVATION_CONTEXT = 'koh-indexnow\/v1|';\n\n    private const MIN_SECRET_BYTES = 32;\n\n    private function __construct(public string $value) {}\n\n    public static function fromString(string $value): self\n    {\n        if (preg_match(self::PATTERN, $value) !== 1) {\n            throw InvalidKey::malformed(strlen($value));\n        }\n\n        return new self($value);\n    }\n\n    \/**\n     * A stable, host-specific key from an installation secret (HMAC-SHA256, 64 hex characters).\n     *\n     * The same secret and host always give the same key, so every replica of an\n     * application agrees on it without coordination. Rotating the secret rotates\n     * the key; the search engines simply learn the new one on the next submission.\n     *\/\n    public static function derive(string $secret, string $host): self\n    {\n        if (strlen($secret) < self::MIN_SECRET_BYTES) {\n            throw InvalidKey::weakSecret(strlen($secret));\n        }\n\n        return new self(hash_hmac('sha256', self::DERIVATION_CONTEXT . HostName::normalize($host), $secret));\n    }\n\n    \/** \"<key>.txt\" \u2014 the file name the protocol expects at the key location. *\/\n    public function fileName(): string\n    {\n        return $this->value . '.txt';\n    }\n\n    \/**\n     * Whether a request path asks for this key's file below $basePath.\n     *\n     * Compared in constant time: the answer to \"is this the key?\" must not leak\n     * how many leading characters of a guess were right.\n     *\/\n    public function isFilePath(string $path, string $basePath = '\/'): bool\n    {\n        return hash_equals($this->filePath($basePath), $path);\n    }\n\n    public function filePath(string $basePath = '\/'): string\n    {\n        return rtrim($basePath, '\/') . '\/' . $this->fileName();\n    }\n\n    public function equals(self $other): bool\n    {\n        return hash_equals($this->value, $other->value);\n    }\n\n    public function __toString(): string\n    {\n        return $this->value;\n    }\n}\n","mutants":[{"id":"d011e529787d3771bcebe057bcd0cac5","mutatorName":"PublicVisibility","replacement":"protected static function fromString(string $value): self","description":"Replaces the `public` method visibility keyword with `protected`.","location":{"start":{"line":33,"column":5},"end":{"line":33,"column":59}},"status":"Killed","statusReason":"PHPUnit 12.5.36 by Sebastian Bergmann and contributors.\n\nRuntime:       PHP 8.5.8\nConfiguration: \/private\/var\/folders\/cz\/m_7cdc311m77krsclk6kr88r0000gn\/T\/infection\/phpunitConfiguration.d011e529787d3771bcebe057bcd0cac5.infection.xml\n\nF\n\nTime: 00:00.003, Memory: 18.00 MB\n\nThere was 1 failure:\n\n1) Koh\\IndexNow\\Tests\\KeyTest::keysOutsideTheProtocolAlphabetAreRefused@too short with data ('abc1234')\nFailed asserting that exception of type \"Error\" matches expected exception \"Koh\\IndexNow\\Exception\\InvalidKey\". Message was: \"Call to protected method Koh\\IndexNow\\Key::fromString() from scope Koh\\IndexNow\\Tests\\KeyTest\" at\n\/Volumes\/Samsung_X5\/Projects\/koh-indexnow\/tests\/KeyTest.ph s=1);\n\nnamespace Koh\\IndexNow;\n\nuse Koh\\IndexNow\\Exception\\InvalidUrl;\n\n\/**\n * One host, one key, a list of URLs \u2014 exactly what the protocol's POST body carries.\n *\n * Everything the search engine would reject with a 422 is rejected here\n * instead, before a request is made: a URL on another host, a URL outside the\n * key file's directory, a scheme other than http(s). Construction is strict on\n * purpose; use UrlCollection to sort a mixed, untrusted list first.\n *\/\nfinal readonly class Submission\n{\n    \/** The protocol's limit per POST. *\/\n    public const MAX_URLS = 10000;\n\n    \/** @param list<string> $urls *\/\n    private function __construct(\n        public string $host,\n        public Key $key,\n        public array $urls,\n        public ?string $keyLocation,\n    ) {}\n\n    \/**\n     * @param iterable<string> $urls\n     * @param string|null $keyLocation absolute URL of the key file when it is not \"\/<key>.txt\";\n     *                                 its directory then limits which URLs may be submitted\n     *\n     * @throws InvalidUrl\n     *\/\n    public static function forHost(string $host, Key $key, iterable $urls, ?string $keyLocation = null): self\n    {\n        $host = HostName::normalize($host);\n        $scope = '\/';\n\n        if ($keyLocation !== null) {\n            $location = Url::parse($keyLocation);\n            if ($location->host !== $host) {\n                throw new InvalidUrl($keyLocation, 'the key location must be on the submitted host');\n            }\n            if (!str_ends_with($location->path, '\/' . $key->fileName())) {\n                throw new InvalidUrl($keyLocation, 'the key location must point at \"<key>.txt\"');\n            }\n            $keyLocation = $location->url;\n            $scope = substr($location->path, 0, (int) strrpos($location->path, '\/') + 1);\n        }\n\n        $unique = [];\n        foreach ($urls as $candidate) {\n            $url = Url::parse($candidate
